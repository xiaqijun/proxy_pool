# ProxyPool 反向代理示例
#
# 场景一：Nginx 安装在宿主机，Docker 映射了 5010/5011 到 127.0.0.1
#   proxy_pass http://127.0.0.1:5010;
#   stream proxy_pass 127.0.0.1:5011;
#
# 场景二：Nginx 也运行在 Docker Compose 网络中
#   proxy_pass http://api:5010;
#   stream proxy_pass gateway:5011;
#
# 注意：
#   1. 工作台 SSE 必须关闭缓冲，否则指标不会实时刷新。
#   2. stream 模块可能需要 Nginx 编译时启用（nginx-full/部分镜像需 load_module）。
#   3. 如果托管平台不提供原始 TCP 端口，网关无法通过普通 HTTP 反向代理暴露。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream proxy_pool_api {
        server 127.0.0.1:5010;
    }

    server {
        listen 80;
        server_name proxy.example.com;

        # HTTPS 示例：
        # listen 443 ssl http2;
        # ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://proxy_pool_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # SSE 实时推送：关闭缓冲和缓存
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

# 网关是 HTTP 正向代理，必须使用 TCP 透传，不能用普通 HTTP location 反代。
stream {
    upstream proxy_pool_gateway {
        server 127.0.0.1:5011;
    }

    server {
        listen 5011;
        proxy_pass proxy_pool_gateway;
        proxy_timeout 3600s;
    }
}
