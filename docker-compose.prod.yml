# 生产部署：API + 调度器 + 网关 + Redis
# 使用前：cp .env.example .env && 修改 .env
# 启动：docker compose -f docker-compose.prod.yml up -d --build

x-app: &app
  image: proxy-pool:latest
  restart: unless-stopped
  stop_grace_period: 20s
  entrypoint: ["tini", "--", "python", "proxyPool.py"]
  volumes:
    - monitor_data:/app/data
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  DB_CONN: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0"
  MONITOR_ENABLED: "true"
  MONITOR_DB_PATH: "/app/data/monitor.db"
  MONITOR_AUTH_USER: "${MONITOR_AUTH_USER:-admin}"
  MONITOR_AUTH_PASSWORD: "${MONITOR_AUTH_PASSWORD:?set MONITOR_AUTH_PASSWORD in .env}"
  MONITOR_COOKIE_SECURE: "${MONITOR_COOKIE_SECURE:-false}"
  MONITOR_RETENTION_DAYS: "${MONITOR_RETENTION_DAYS:-7}"
  MONITOR_REFRESH_SECONDS: "${MONITOR_REFRESH_SECONDS:-5}"
  GATEWAY_AUTH: "${GATEWAY_AUTH:?set GATEWAY_AUTH in .env}"
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: "${GATEWAY_PORT:-5011}"
  PROXY_STRATEGY: "${PROXY_STRATEGY:-random}"
  GATEWAY_STRATEGY: "${GATEWAY_STRATEGY:-random}"
  WAF_DETECT_ENABLED: "${WAF_DETECT_ENABLED:-true}"
  WAF_SCORE_THRESHOLD: "${WAF_SCORE_THRESHOLD:-2}"
  TIMEZONE: "${TIMEZONE:-Asia/Shanghai}"

services:
  redis:
    image: redis:7-alpine
    container_name: proxy_pool_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *app
    build: .
    container_name: proxy_pool_api
    command: ["server"]
    environment:
      <<: *app-env
      HOST: "0.0.0.0"
      PORT: "${API_PORT:-5010}"
    ports:
      - "${API_PORT:-5010}:${API_PORT:-5010}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('PORT', '5010'), timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    container_name: proxy_pool_scheduler
    # 只运行一个调度器实例，避免重复采集和校验
    command: ["schedule"]
    environment:
      <<: *app-env

  gateway:
    <<: *app
    container_name: proxy_pool_gateway
    command: ["gateway"]
    environment:
      <<: *app-env
    ports:
      - "${GATEWAY_PORT:-5011}:${GATEWAY_PORT:-5011}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, socket; s=socket.create_connection(('127.0.0.1', int(os.environ.get('GATEWAY_PORT', '5011'))), 3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  redis_data:
  monitor_data:
